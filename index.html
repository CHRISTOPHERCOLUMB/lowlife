<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>НИЗШАЯ ЖИЗНЬ: Путь к высшей</title>
<style>
:root{
  --bg:#1e1b17; --paper:#e9dec7; --paper2:#d8c8a8; --ink:#28231d;
  --muted:#6e6352; --line:#8e7d62; --accent:#5d4934; --accent2:#7b674d;
  --danger:#743f37; --good:#4f674c; --shadow:#0008;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{
  font-family:Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at 20% 10%,#ffffff08 0 2px,transparent 3px),
    radial-gradient(circle at 80% 70%,#00000012 0 1px,transparent 2px),
    #1e1b17;
}
button{font:inherit;color:inherit}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
.app{width:min(680px,100%);margin:auto;padding:10px}
.paper{
  min-height:calc(100vh - 20px);
  background:
    linear-gradient(90deg,#00000008 1px,transparent 1px),
    linear-gradient(#00000005 1px,transparent 1px),
    linear-gradient(135deg,var(--paper),#f0e6d2 48%,var(--paper2));
  background-size:100% 100%,100% 100%,100% 100%;
  box-shadow:0 0 40px #000b;
  border:1px solid #7b6c55;
  position:relative;overflow:hidden;
}
.paper:after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;
  background-image:radial-gradient(#000 0.55px,transparent .7px);
  background-size:5px 5px;
}
.ui{position:relative;z-index:1;padding:12px}
.header{
  display:grid;grid-template-columns:1fr auto;gap:10px;
  border-bottom:2px solid var(--line);padding-bottom:9px
}
.name{font-size:19px;font-weight:900;letter-spacing:.5px}
.sub{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.clock{text-align:right;font-size:13px;color:var(--muted)}
.clock b{font-size:18px;color:var(--ink)}
.profile{
  margin-top:10px;border:1px solid var(--line);background:#00000008;padding:9px;
  display:grid;grid-template-columns:1fr 1fr;gap:7px
}
.money{font-size:22px;font-weight:900}
.xp{font-size:11px;color:var(--muted);margin-top:2px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{border:1px solid #9a896d;padding:6px;background:#ffffff18}
.statline{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
.bar{height:6px;background:#b6a78c;border:1px solid #8b7b61}
.fill{height:100%;background:var(--accent)}
.fill.bad{background:var(--danger)}

.panel{
  margin-top:10px;border:1px solid var(--line);background:#ffffff16;
  min-height:270px;padding:10px
}
.panel-title{
  display:flex;justify-content:space-between;align-items:end;
  border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:9px
}
.panel-title h2{font-size:16px;margin:0}
.panel-title span{font-size:10px;color:var(--muted);text-transform:uppercase}
.content{font-size:14px;line-height:1.45}
.story-preview{
  border-left:3px solid var(--accent);padding:8px 10px;background:#00000008;margin-bottom:9px
}
.event-list{max-height:180px;overflow:auto}
.event{padding:7px 0;border-bottom:1px dotted #9b8b70}
.event b{font-size:11px;color:var(--muted);margin-right:5px}
.cardgrid{display:grid;gap:7px}
.action-card{
  border:1px solid var(--line);background:#d7c7a7;padding:9px;text-align:left;
  box-shadow:0 2px 0 #7c6d57;cursor:pointer;width:100%
}
.action-card strong{display:block;font-size:14px}
.action-card small{display:block;color:var(--muted);margin-top:3px;font-size:11px}
.action-card .tag{float:right;border:1px solid #8d7c61;padding:2px 5px;font-size:10px}
.notice{padding:9px;border-left:3px solid var(--accent);background:#00000008;font-size:12px}
.nav{
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:9px;
  border-top:1px solid var(--line);padding-top:8px
}
.nav button{
  min-height:50px;border:1px solid var(--line);background:#d3c19e;
  padding:5px 3px;font-size:10px;font-weight:700;cursor:pointer
}
.nav button.active{background:#a99573;box-shadow:inset 0 0 0 2px #5f4c37}
.icon{font-size:17px;display:block;margin-bottom:2px}
.modal{
  position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;
  padding:12px;z-index:20
}
.modal.open{display:flex}
.story-card{
  width:min(640px,100%);max-height:92vh;overflow:auto;
  background:linear-gradient(135deg,#eee2ca,#d9c8a5);
  border:1px solid #77664e;box-shadow:0 15px 50px #000c;
  position:relative
}
.story-head{padding:12px;border-bottom:2px solid var(--line)}
.story-head .chapter{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.story-head h2{margin:4px 0 0;font-size:22px}
.story-body{padding:14px}
.story-body p{margin:0 0 11px;line-height:1.55}
.story-choices{display:grid;gap:7px;padding:0 14px 14px}
.choice{
  width:100%;text-align:left;padding:12px;border:1px solid var(--line);
  background:#cdbb99;box-shadow:0 2px 0 #776852;cursor:pointer
}
.choice strong{display:block}.choice small{display:block;color:var(--muted);margin-top:3px}
.close{position:absolute;right:8px;top:8px;border:0;background:transparent;font-size:22px;cursor:pointer}
.badge{display:inline-block;border:1px solid var(--line);padding:2px 5px;font-size:10px;margin-right:4px}
.empty{color:var(--muted);font-style:italic}

.minigame-wrap{padding:6px 0}
.minigame-info{font-size:12px;color:var(--muted);margin-bottom:12px}
.skillbar{height:34px;border:1px solid var(--line);background:#b7a789;position:relative;overflow:hidden}
.skillzone{position:absolute;top:0;height:100%;background:#6c7b61aa}
.skillmarker{position:absolute;top:-2px;width:5px;height:38px;background:#2d261e;box-shadow:0 0 0 1px #eee}
.timerline{font-size:11px;color:var(--muted);margin-top:7px}
.mini-buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.mini-btn{padding:11px;border:1px solid var(--line);background:#cdbb99;cursor:pointer}

@media(max-width:420px){
  .ui{padding:9px}.name{font-size:16px}.money{font-size:19px}
  .nav button{font-size:9px}.icon{font-size:15px}.panel{min-height:250px}
}

/* ===== GHOST ARCHIVE UI ===== */
:root{
  --paper:#e6d4b1;--paper2:#cbb58d;--ink:#2a2119;--line:#6c5a45;
  --metal-text:#ead8b7;--metal-muted:#bfae90;--metal-shadow:#120f0b;
}
body{background:#171512 url("assets/textures/metal.png") center/720px 720px repeat}
.app{padding:8px;max-width:700px}
.paper{
  background:#e8d8ba url("assets/textures/paper.png") center/cover repeat;
  border:0;box-shadow:0 0 0 2px #1b1814,0 14px 45px #000d;
}
.paper:after{opacity:.07}

/* Metal-backed profile: light text + dark shadow for contrast. */
.profile{
  background:url("assets/ui/metal_panel.png") center/100% 100% no-repeat;
  border:0;padding:17px 18px;color:var(--metal-text);
  text-shadow:0 1px 2px #090806,0 0 3px #090806;
}
.profile .money{color:#f2dfba;font-size:22px;line-height:1.1}
.profile .xp{color:var(--metal-muted)}
.profile .stat{background:#09080655;border:1px solid #d0b98f55;color:#f0dfc1}
.profile .statline{font-size:10px;line-height:1.15}
.profile .statline span{white-space:nowrap}
.profile .bar{background:#08070599;border:1px solid #d5bf9955;height:7px}
.profile .fill{background:#d2b47e;box-shadow:0 0 4px #0008}
.profile .fill.bad{background:#a76a58}

/* Main panel */
.panel{
  background:url("assets/ui/panel.png") center/100% 100% no-repeat;
  border:0;padding:21px 23px 23px;filter:drop-shadow(0 3px 4px #0005);
  color:var(--ink);overflow:hidden;
}
.panel-title{
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  border-bottom:1px solid #75634d;padding:0 2px 8px;margin-bottom:10px;
}
.panel-title h2{font-size:17px;line-height:1.15;margin:0;min-width:0;overflow-wrap:break-word}
.panel-title span{font-size:9px;color:#655541;text-transform:uppercase;line-height:1.2;text-align:right;max-width:42%;overflow-wrap:break-word}
.content{font-size:14px;line-height:1.45;min-width:0;overflow:hidden}
.story-preview,.notice{color:#342a20}
.story-preview{border-left:3px solid #5e4b38;padding:9px 11px;background:#0000000b;margin-bottom:9px;overflow-wrap:break-word}
.notice{padding:10px 11px;border-left:3px solid #5e4b38;background:#0000000b;font-size:12px;overflow-wrap:break-word}
.event-list{max-height:180px;overflow:auto}
.event{padding:7px 0;border-bottom:1px dotted #9b8b70;overflow-wrap:break-word}
.event b{font-size:11px;color:#665844;margin-right:5px}

/* Buttons: generous inner safe area so generated texture never fights the text. */
.cardgrid{display:grid;gap:9px;min-width:0}
.action-card,.choice,.mini-btn{
  position:relative;width:100%;min-width:0;min-height:70px;
  border:0;background:url("assets/ui/button.png") center/100% 100% no-repeat;
  box-shadow:none;color:#30251b;text-align:left;cursor:pointer;
  padding:16px 78px 16px 25px;text-shadow:0 1px 0 #f2e4c9;
  overflow:hidden;
}
.action-card strong,.choice strong{display:block;font-size:13px;line-height:1.18;font-weight:800;overflow-wrap:break-word}
.action-card small,.choice small{display:block;color:#675542;margin-top:4px;font-size:10px;line-height:1.28;overflow-wrap:break-word}
.action-card .tag{
  position:absolute;right:20px;top:50%;transform:translateY(-50%);
  max-width:58px;border:1px solid #806d52;padding:4px 5px;font-size:9px;
  line-height:1.1;text-align:center;overflow-wrap:break-word;background:#d8c39d99;
}
.action-card:active,.choice:active,.mini-btn:active,.nav button:active{
  background-image:url("assets/ui/button_pressed.png");transform:translateY(1px)
}

/* Bottom navigation: no emoji, only clean labels. */
.nav{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:10px;
  border-top:1px solid #675643;padding-top:9px;min-width:0;
}
.nav button{
  min-width:0;min-height:52px;border:0;
  background:url("assets/ui/button.png") center/100% 100% no-repeat;
  padding:9px 4px;font-size:10px;font-weight:800;line-height:1.1;
  color:#30251b;text-shadow:0 1px 0 #f2e4c9;cursor:pointer;
  white-space:normal;overflow-wrap:break-word;word-break:normal;
}
.nav button.active{background-image:url("assets/ui/button_pressed.png");box-shadow:none;color:#241b14}

/* Story/event window */
.story-card{
  width:min(640px,100%);max-height:92vh;overflow:auto;
  background:#e5d5b6 url("assets/ui/events.png") center/100% 100% no-repeat;
  border:0;box-shadow:0 15px 50px #000c;position:relative;color:var(--ink)
}
.story-head{padding:24px 25px 12px;border-bottom:0}
.story-head .chapter{font-size:10px;letter-spacing:2px;color:#655541;text-transform:uppercase}
.story-head h2{margin:4px 0 0;font-size:22px;line-height:1.15;overflow-wrap:break-word}
.story-body{padding:14px 25px;overflow-wrap:break-word}
.story-body p{margin:0 0 11px;line-height:1.55;overflow-wrap:break-word}
.story-choices{display:grid;gap:8px;padding:0 25px 25px}
.choice{min-height:62px;padding:14px 20px}
.close{position:absolute;right:13px;top:10px;border:0;background:transparent;color:#3a2d21;font-size:24px;cursor:pointer}

/* Mini games */
.minigame-wrap{padding:6px 0}.minigame-info{font-size:12px;color:#665844;margin-bottom:12px}
.skillbar{height:34px;border:1px solid #6c5a45;background:#b7a789;position:relative;overflow:hidden}
.skillzone{position:absolute;top:0;height:100%;background:#6c7b61aa}.skillmarker{position:absolute;top:-2px;width:5px;height:38px;background:#2d261e;box-shadow:0 0 0 1px #eee}
.timerline{font-size:11px;color:#665844;margin-top:7px}.mini-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini-btn{min-height:52px;padding:12px 18px;text-align:center}

/* Hard limits that prevent any component from pushing the layout wider. */
*,*::before,*::after{min-width:0}
button{max-width:100%}
.action-card,.choice,.mini-btn,.nav button{overflow-wrap:break-word}

@media(max-width:420px){
  .ui{padding:8px}.name{font-size:16px}.money{font-size:19px}
  .profile{padding:15px 13px}.stat{padding:6px 5px}.profile .statline{font-size:9.5px}
  .panel{padding:18px 17px 20px}.panel-title h2{font-size:16px}.panel-title span{font-size:8px;max-width:38%}
  .content{font-size:13px}.action-card{min-height:72px;padding:15px 69px 15px 20px}
  .action-card strong{font-size:12px}.action-card small{font-size:9.5px}.action-card .tag{right:15px;max-width:50px;font-size:8.5px}
  .nav{gap:3px}.nav button{min-height:48px;padding:8px 2px;font-size:9px}
  .story-head{padding:22px 19px 10px}.story-body{padding:12px 19px}.story-choices{padding:0 19px 19px}
}
@media(max-width:340px){
  .profile{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr}
  .nav button{font-size:8.5px}.action-card{padding-left:17px;padding-right:62px}
}

/* FINAL UI POLISH v2 */
.profile > div:first-child{padding-left:10px}
.profile{grid-template-columns:minmax(105px,.72fr) minmax(0,1.6fr);gap:12px}
.profile .money{white-space:nowrap}
.profile .xp{white-space:normal}

.panel-title{align-items:center}
.panel-title h2,.panel-title span{min-width:0;overflow:hidden;text-overflow:ellipsis}

/* Large readable action buttons: text is allowed to use as many lines as needed. */
.action-card,.choice,.mini-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-sizing:border-box;width:100%;min-height:112px;height:auto;
  padding:15px 22px;gap:0;text-align:center;overflow:visible;
}
.action-card strong,.choice strong{
  display:block;width:100%;max-width:100%;margin:0;
  font-size:14px;line-height:1.28;font-weight:800;letter-spacing:.1px;
  color:#2d231a;text-shadow:0 1px 0 #f2e4c9;
  overflow:visible;white-space:normal;overflow-wrap:anywhere;word-break:normal;
}
.action-card small,.choice small{
  display:block;width:100%;max-width:100%;margin:7px 0 0;
  font-size:10.5px;line-height:1.35;font-weight:600;color:#66513d;
  overflow:visible;white-space:normal;overflow-wrap:anywhere;word-break:normal;
}
.action-card .tag{
  position:static;transform:none;float:none;display:inline-flex;align-items:center;justify-content:center;
  width:max-content;max-width:100%;margin:9px 0 0;padding:4px 11px;
  border:1px solid #715d46;border-radius:3px;background:#3b3024;color:#f0dfc2;
  text-shadow:0 1px 1px #000;font-size:10px;font-weight:800;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;
}

/* Bottom navigation stays compact and centered. */
.nav button,.nav button.active{
  background:url("assets/ui/button.png") center/100% 100% no-repeat !important;
  box-shadow:none !important;color:#30251b;
}
.nav button.active{background-image:url("assets/ui/button_pressed.png") !important}
.nav button{
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:8px 4px;min-height:55px;font-size:10px;line-height:1.1;
  white-space:normal;overflow:hidden;overflow-wrap:anywhere;
}

.content,.story-body,.story-head,.notice,.story-preview,.event{overflow-wrap:anywhere;word-break:break-word}

@media(max-width:420px){
 .profile{grid-template-columns:minmax(100px,.68fr) minmax(0,1.7fr);gap:9px}
 .profile > div:first-child{padding-left:8px}
 .action-card,.choice,.mini-btn{min-height:118px;padding:14px 18px}
 .action-card strong,.choice strong{font-size:13px;line-height:1.28}
 .action-card small,.choice small{font-size:10px;line-height:1.34;margin-top:7px}
 .action-card .tag{font-size:9px;padding:4px 9px;margin-top:8px}
 .nav button{min-height:50px;font-size:8.5px;padding:7px 2px}
}
@media(max-width:340px){
 .profile{grid-template-columns:1fr 1.5fr}
 .profile > div:first-child{padding-left:6px}
 .action-card,.choice,.mini-btn{min-height:124px;padding:14px 14px}
 .action-card strong,.choice strong{font-size:12.5px}
 .action-card small,.choice small{font-size:9.5px}
 .nav button{font-size:8px}
}
</style>
</head>
<body>
<div class="app"><main class="paper">
<div class="ui">
  <header class="header">
    <div>
      <div class="name">Рублёв Николай Николаевич</div>
      <div class="sub">НИЗШАЯ ЖИЗНЬ · ПУТЬ К ВЫСШЕЙ</div>
    </div>
    <div class="clock"><b id="clock">06:37</b><br><span id="day">День 1 · Пн</span></div>
  </header>

  <section class="profile">
    <div>
      <div class="money" id="money">0 ₽</div>
      <div class="xp">Уровень <b id="level">1</b> · <span id="xp">0</span>/100 XP</div>
    </div>
    <div class="statgrid">
      <div class="stat"><div class="statline"><span>Здоровье</span><b id="healthV">72</b></div><div class="bar"><div class="fill" id="healthB"></div></div></div>
      <div class="stat"><div class="statline"><span>Энергия</span><b id="energyV">54</b></div><div class="bar"><div class="fill" id="energyB"></div></div></div>
      <div class="stat"><div class="statline"><span>Сытость</span><b id="foodV">32</b></div><div class="bar"><div class="fill" id="foodB"></div></div></div>
      <div class="stat"><div class="statline"><span>Тяга</span><b id="cravingV">74</b></div><div class="bar"><div class="fill bad" id="cravingB"></div></div></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">
      <h2 id="panelTitle">История</h2>
      <span id="panelSub">главное</span>
    </div>
    <div id="panelContent" class="content"></div>
  </section>

  <nav class="nav">
    <button data-tab="story" onclick="setTab('story')">История</button>
    <button data-tab="work" onclick="setTab('work')">Заработок</button>
    <button data-tab="shop" onclick="setTab('shop')">Магазин</button>
    <button data-tab="quests" onclick="setTab('quests')">Задания</button>
    <button data-tab="more" onclick="setTab('more')">Ещё</button>
  </nav>
</div>
</main></div>

<div class="modal" id="storyModal">
  <div class="story-card">
    <button class="close" onclick="closeStory()">×</button>
    <div class="story-head"><div class="chapter" id="storyChapter">ГЛАВА I · ПЕРВЫЙ ДЕНЬ</div><h2 id="storyTitle"></h2></div>
    <div class="story-body" id="storyBody"></div>
    <div class="story-choices" id="storyChoices"></div>
  </div>
</div>

<script>
const KEY="nizhshaya_zhizn_v02";
const DAYS=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
let s={
  money:0,health:72,energy:54,food:32,craving:74,dependence:81,
  xp:0,level:1,day:1,minutes:397,tab:"story",mini:null,
  inventory:[],flags:{},log:[],seenStories:{}
};

function loadGame(){
  try{const x=JSON.parse(localStorage.getItem(KEY));if(x)s={...s,...x,flags:{...s.flags,...(x.flags||{})},seenStories:{...s.seenStories,...(x.seenStories||{})}}}catch(e){}
}
function saveGame(){
  localStorage.setItem(KEY,JSON.stringify(s));
}
function fmtMoney(n){return Math.floor(n).toLocaleString("ru-RU")+" ₽"}
function clamp(n){return Math.max(0,Math.min(100,n))}
function timeText(){let h=Math.floor(s.minutes/60)%24,m=s.minutes%60;return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")}
function addLog(text){s.log.unshift({t:timeText(),text});s.log=s.log.slice(0,35)}
function addTime(min){
  s.minutes+=min;
  while(s.minutes>=1440){s.minutes-=1440;s.day++;addLog("Начался новый день.")}
  const hours=min/60;
  s.food=clamp(s.food-hours*1.15);
  s.craving=clamp(s.craving+hours*.9);
  if(s.food<8)s.health=clamp(s.health-hours*.28);
  if(s.energy<5)s.health=clamp(s.health-hours*.18);
}
function xpNeed(){return 100 + (s.level-1)*35}
function addXP(n){
  s.xp+=n;
  while(s.xp>=xpNeed()){
    s.xp-=xpNeed();s.level++;addLog("Новый уровень: "+s.level+".");
  }
}
function spend(cost){
  if(s.money<cost)return false;s.money-=cost;return true;
}
function doAction({minutes=0,money=0,health=0,energy=0,food=0,craving=0,xp=0,msg}){
  addTime(minutes);
  s.money+=money;
  s.health=clamp(s.health+health);
  s.energy=clamp(s.energy+energy);
  s.food=clamp(s.food+food);
  s.craving=clamp(s.craving+craving);
  addXP(xp);
  if(msg)addLog(msg);
  checkMilestones();
  saveGame();render();
}
function showStory(id,chapter,title,body,choices){
  if(s.seenStories[id])return;
  document.getElementById("storyChapter").textContent=chapter;
  document.getElementById("storyTitle").textContent=title;
  document.getElementById("storyBody").innerHTML=body;
  const box=document.getElementById("storyChoices");box.innerHTML="";
  choices.forEach(c=>{
    const b=document.createElement("button");b.className="choice";
    b.innerHTML="<strong>"+c.title+"</strong>"+(c.desc?"<small>"+c.desc+"</small>":"");
    b.onclick=()=>{s.seenStories[id]=true;c.fn();closeStory();saveGame();render()};
    box.appendChild(b);
  });
  document.getElementById("storyModal").classList.add("open");
}
function closeStory(){document.getElementById("storyModal").classList.remove("open")}

function setTab(tab){s.tab=tab;saveGame();render()}

function render(){
  document.getElementById("money").textContent=fmtMoney(s.money);
  document.getElementById("level").textContent=s.level;
  document.getElementById("xp").textContent=s.xp+"/"+xpNeed();
  document.getElementById("clock").textContent=timeText();
  document.getElementById("day").textContent="День "+s.day+" · "+DAYS[(s.day-1)%7].slice(0,2);
  for(const [id,key] of [["health","health"],["energy","energy"],["food","food"],["craving","craving"]]){
    document.getElementById(id+"V").textContent=Math.round(s[key]);
    document.getElementById(id+"B").style.width=s[key]+"%";
  }
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===s.tab));
  renderPanel();
}
function renderPanel(){
  const title=document.getElementById("panelTitle"),sub=document.getElementById("panelSub"),c=document.getElementById("panelContent");
  if(s.tab==="story"){
    title.textContent="История";sub.textContent="главное";
    const last=s.log.slice(0,7).map(x=>`<div class="event"><b>${x.t}</b>${x.text}</div>`).join("");
    c.innerHTML=`
      <div class="story-preview"><b>Текущая ситуация</b><br>
      Ты на улицах Мурманска. У тебя нет дома, работы и документов. Но впервые за долгое время есть одна вещь — план.</div>
      <div class="notice"><b>Следующий сюжетный шаг:</b> ${currentGoal()}</div>
      <h3 style="font-size:12px;border-bottom:1px solid var(--line);padding-bottom:5px">Последние события</h3>
      <div class="event-list">${last||'<span class="empty">Пока ничего не произошло.</span>'}</div>`;
  }else if(s.tab==="work"){
    title.textContent="Заработок";sub.textContent="работа и деньги";
    const jobs=[
      {name:"Разовая подработка",desc:"1 час · простая работа без документов",pay:"180–260 ₽",need:10,mins:60,food:-5,xp:7},
      {name:"Погрузка",desc:"2 часа · тяжелее, но платят больше",pay:"600–850 ₽",need:25,mins:120,food:-10,xp:14}
    ];
    c.innerHTML='<div class="cardgrid">'+jobs.map((j,i)=>`
      <button class="action-card" onclick="doJob(${i})" ${s.energy<j.need?'disabled':''}>
        <span class="tag">${j.pay}</span><strong>${j.name}</strong><small>${j.desc} · −${j.need} энергии · −${Math.abs(j.food)} сытости</small>
      </button>`).join("")+
      `<button class="action-card" onclick="learnDocuments()"><strong>Разобраться с документами</strong><small>20 минут · −3 энергии · открывает путь к нормальной работе</small></button>
      <div class="notice">Подработки можно повторять, но они занимают время и силы. Бесконечной бесплатной фарм-тапалки здесь не будет.</div>
      </div>`;
  }else if(s.tab==="shop"){
    title.textContent="Магазин";sub.textContent="еда и необходимые вещи";
    const items=[
      {name:"Хлеб",price:60,food:18},
      {name:"Лапша быстрого приготовления",price:70,food:22},
      {name:"Суп",price:110,food:35},
      {name:"Сытный горячий обед",price:280,food:55}
    ];
    c.innerHTML='<div class="cardgrid">'+items.map((x,i)=>`
      <button class="action-card" onclick="buyFood(${i})" ${s.money<x.price?'disabled':''}>
        <span class="tag">${x.price} ₽</span><strong>${x.name}</strong><small>+${x.food} сытости · 2 минуты</small>
      </button>`).join("")+
      `<div class="notice">Цены пока тестовые. Экономику будем балансировать по реальному прохождению.</div></div>`;
  }else if(s.tab==="quests"){
    title.textContent="Задания";sub.textContent="сюжет";
    c.innerHTML=`
      <div class="notice"><b>Главная линия</b><br>${currentGoal()}</div>
      <div style="margin-top:9px">
        <span class="badge">Глава I</span><span class="badge">Мурманск</span>
      </div>
      <div class="cardgrid" style="margin-top:9px">
        <div class="action-card"><strong>Вернуть себе имя</strong><small>${s.flags.docsStarted?"Начато":"Пока закрыто: нужны первые деньги и информация о документах."}</small></div>
        <div class="action-card"><strong>Пережить первый день</strong><small>Основная цель первой главы.</small></div>
      </div>`;
  }else{
    title.textContent="Ещё";sub.textContent="интерфейс";
    c.innerHTML=`
      <div class="cardgrid">
        <button class="action-card" onclick="sleepMenu()"><strong>Отдых / сон</strong><small>Выбери, сколько часов проспать. Время проходит, энергия восстанавливается.</small></button>
        <button class="action-card" onclick="showInventory()"><strong>Инвентарь</strong><small>Вещи, которые у тебя есть.</small></button>
        <button class="action-card" onclick="showMap()"><strong>Карта</strong><small>Доступные места Мурманска.</small></button>
        <button class="action-card" onclick="saveGame();addLog('Игра сохранена.');render()"><strong>Сохранить</strong><small>Сохранение в памяти браузера.</small></button>
        <div class="notice">Версия v0.2. Это уже каркас интерфейса; дальше добавим нормальную карту, достижения, больше сюжетных сцен и визуальные ассеты.</div>
      </div>`;
  }
}

function checkMilestones(){
  if(!s.flags.first100 && s.money>=100){
    s.flags.first100=true;
    addLog("У тебя появились первые 100 ₽. Теперь главная задача — поесть.");
    setTimeout(()=>showStory("first100","ГЛАВА I · ПЕРВЫЙ ДЕНЬ","Первые сто",
      "<p>Сто рублей. Для кого-то — мелочь. Для тебя сейчас это доказательство, что день ещё можно вытянуть.</p><p>Но деньги быстро заканчиваются, если тратить их без плана.</p>",
      [{title:"Сначала поесть",desc:"Открыть магазин.",fn:()=>setTab("shop")},
       {title:"Сначала заработать ещё",desc:"Не останавливаться на первых ста рублях.",fn:()=>setTab("work")}]),250);
  }
  if(s.money>=110 && !s.flags.first100) { s.flags.first100=true; }
}
function currentGoal(){
  if(!s.flags.first100)return"Найти первые 100 ₽.";
  if(!s.flags.firstMeal)return"Найти еду и восстановить силы.";
  if(!s.flags.docs)return"Найти способ заработать и узнать про документы.";
  if(!s.flags.docsStarted)return"Начать восстановление документов.";
  return"Продолжить цепочку восстановления документов.";
}
function doJob(i){
  const jobs=[
    {name:"Разовая подработка",mins:60,need:10,food:-5,base:220,xp:7,type:"sequence"},
    {name:"Погрузка",mins:120,need:25,food:-10,base:720,xp:14,type:"timing"}
  ];
  const j=jobs[i];
  if(s.energy<j.need){addLog("Сейчас ты слишком вымотан для этой работы.");render();return}
  startMiniGame(j);
}
function startMiniGame(job){
  s.mini={job,started:Date.now(),timeLeft:8,marker:0,dir:1,done:false,
    seq:["A","C","B","D"].sort(()=>Math.random()-.5),pos:0};
  document.getElementById("storyModal").classList.add("open");
  document.getElementById("storyChapter").textContent="РАБОТА · ПРОВЕРКА НАВЫКА";
  document.getElementById("storyTitle").textContent=job.name;
  renderMiniGame();
}
function renderMiniGame(){
  const m=s.mini;if(!m)return;
  const body=document.getElementById("storyBody"), choices=document.getElementById("storyChoices");
  if(m.job.type==="timing"){
    body.innerHTML=`<div class="minigame-wrap">
      <p>Нужно выполнить работу аккуратно и вовремя. Нажми <b>«Сделать»</b>, когда маркер попадёт в светлую зону.</p>
      <div class="skillbar"><div class="skillzone" style="left:38%;width:24%"></div><div class="skillmarker" style="left:${m.marker}%"></div></div>
      <div class="timerline">Осталось: <b>${Math.ceil(m.timeLeft)}</b> сек.</div>
    </div>`;
    choices.innerHTML=`<button class="choice" onclick="miniAction()">Сделать</button>`;
  }else{
    body.innerHTML=`<div class="minigame-wrap">
      <p>Нажимай кнопки в правильном порядке. Ошибка снижает оплату.</p>
      <div class="notice">Последовательность: <b>${m.seq.map((x,i)=>i<m.pos?"✓":x).join("  ")}</b></div>
    </div>`;
    choices.innerHTML=`<div class="mini-buttons">
      <button class="mini-btn" onclick="seqPress('A')">A</button>
      <button class="mini-btn" onclick="seqPress('B')">B</button>
      <button class="mini-btn" onclick="seqPress('C')">C</button>
      <button class="mini-btn" onclick="seqPress('D')">D</button>
    </div>`;
  }
}
function miniAction(){
  if(!s.mini)return;
  const m=s.mini, success=m.marker>=38&&m.marker<=62;
  finishMini(success ? 1 : .18);
}
function seqPress(x){
  if(!s.mini)return;
  const m=s.mini;
  if(x===m.seq[m.pos]){
    m.pos++;
    if(m.pos>=m.seq.length) finishMini(1);
    else renderMiniGame();
  }else{
    finishMini(.12);
  }
}
function finishMini(mult){
  if(!s.mini)return;
  const m=s.mini, job=m.job;
  const pay=Math.max(20,Math.round(job.base*mult));
  document.getElementById("storyModal").classList.remove("open");
  s.mini=null;
  doAction({minutes:job.mins,money:pay,energy:-job.need,food:job.food,xp:Math.max(2,Math.round(job.xp*mult)),
    msg:`Ты закончил работу и получил ${pay} ₽.`});
}
function learnDocuments(){
  if(s.energy<3){addLog("Слишком мало энергии.");render();return}
  doAction({minutes:20,energy:-3,food:-1,xp:5,msg:"Ты узнаёшь, что без восстановления документов нормальную работу найти будет трудно."});
  s.flags.docs=true;saveGame();render();
  if(!s.seenStories.docsIntro){
    setTimeout(()=>showStory("docsIntro","ГЛАВА I · ДОКУМЕНТЫ","Вернуть себе имя",
      "<p>Несколько лет назад ты мог открыть кошелёк и достать паспорт. Теперь у тебя даже этого нет.</p><p>Сначала придётся восстановить документы. И это будет стоить времени и денег.</p>",
      [{title:"Ладно. Начать с малого.",desc:"Продолжить поиски заработка.",fn:()=>{s.flags.docsStarted=true;addLog("Ты начал цепочку восстановления документов.");}}]),200);
  }
}
function buyFood(i){
  const items=[
    {name:"Хлеб",price:60,food:18},{name:"Лапша быстрого приготовления",price:70,food:22},
    {name:"Суп",price:110,food:35},{name:"Сытный горячий обед",price:280,food:55}
  ];
  const x=items[i];
  if(!spend(x.price)){addLog("Не хватает денег.");render();return}
  doAction({minutes:2,food:x.food,xp:2,msg:`Ты купил: ${x.name}.`});
  if(!s.flags.firstMeal){
    s.flags.firstMeal=true;saveGame();
    setTimeout(()=>showStory("firstMeal","ГЛАВА I · ПЕРВЫЙ ДЕНЬ","Первые деньги",
      "<p>Еда не решила твою жизнь. Но голова стала работать чуть яснее.</p><p>Теперь нужен следующий шаг — заработать достаточно, чтобы не возвращаться к нулю каждый вечер.</p>",
      [{title:"Искать работу",desc:"Открыть раздел заработка.",fn:()=>setTab("work")},{title:"Сначала осмотреть город",desc:"Ничего не терять из виду.",fn:()=>setTab("story")}]),200);
  }
}

function sleepMenu(){
  showStory("sleepMenu","ОТДЫХ","Ночь не ждёт",
    "<p>Можно лечь спать и пропустить несколько часов. Сон восстанавливает энергию, но за это время падает сытость и меняется тяга.</p>",
    [
      {title:"Поспать 4 часа",desc:"Умеренное восстановление.",fn:()=>sleep(4)},
      {title:"Поспать 7 часов",desc:"Полноценный отдых.",fn:()=>sleep(7)},
      {title:"Поспать 9 часов",desc:"Дольше, но энергии восстановится больше.",fn:()=>sleep(9)}
    ]);
}
function sleep(hours){
  const before=timeText();
  doAction({minutes:hours*60,energy:Math.min(100,72+s.energy)-s.energy,
    health:Math.min(100,4+hours*0.8),msg:`Ты поспал ${hours} ч. Было ${before}, стало ${timeText()}.`});
}

function showMap(){
  showStory("mapTemp","КАРТА · МУРМАНСК","Карта пока в разработке",
    "<p><b>Открыто:</b> железнодорожный вокзал.</p><p>Дальше появятся улицы, магазин, столовая, больница, места работы и новые районы.</p>",
    [{title:"Понятно",desc:"Вернуться в игру.",fn:()=>{}}]);
}
function showInventory(){
  showStory("invTemp","ИНВЕНТАРЬ","Твои вещи",
    s.inventory.length?("<p>"+s.inventory.join("</p><p>")+"</p>"):"<p>Пока пусто.</p>",
    [{title:"Закрыть",desc:"",fn:()=>{}}]);
}
function firstStory(){
  if(s.seenStories.opening)return;
  setTimeout(()=>showStory("opening","ГЛАВА I · ПЕРВЫЙ ДЕНЬ","06:37",
    "<p>Николай просыпается на скамье на мурманском вокзале. Несколько секунд он просто смотрит в потолок.</p><p>Слишком много всего произошло. Дом сгорел. Семья исчезла из его жизни. Друг погиб. Работа, деньги и документы остались в прошлом.</p><p>Охранник подходит ближе: пора уходить.</p>",
    [
      {title:"Осмотреть себя",desc:"Понять, что у тебя осталось.",fn:()=>{addLog("Ты проверяешь карманы. Денег нет.");addXP(3)}},
      {title:"Осмотреть вокзал",desc:"Возможно, здесь найдётся какая-нибудь возможность.",fn:()=>{addLog("Ты внимательно осматриваешь вокзал.");addXP(3)}},
      {title:"Просто выйти",desc:"Хватит сидеть. Нужно начинать.",fn:()=>{addLog("Ты выходишь на улицу.");addXP(3)}}
    ]),300);
}
loadGame();
if(!s.log.length){
  addLog("06:37. Николай просыпается на вокзале.");
  addLog("Охранник просит его покинуть здание.");
  saveGame();
}
render();
firstStory();


setInterval(()=>{
  if(!s.mini)return;
  const m=s.mini;
  m.timeLeft-=.1;
  if(m.job.type==="timing"){
    m.marker += m.dir*2.2;
    if(m.marker>=96){m.marker=96;m.dir=-1}
    if(m.marker<=2){m.marker=2;m.dir=1}
    renderMiniGame();
  }
  if(m.timeLeft<=0){
    finishMiniGameTimeout();
  }
},100);
function finishMiniGameTimeout(){
  if(!s.mini)return;
  finishMini(.08);
}

setInterval(()=>{
  addTime(1);saveGame();render();
},60000);
</script>
</body>
</html>
