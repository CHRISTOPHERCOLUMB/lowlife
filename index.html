<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>НИЗШАЯ ЖИЗНЬ: Путь к высшей</title>
<style>
:root{
  --bg:#1e1b17; --paper:#e9dec7; --paper2:#d8c8a8; --ink:#28231d;
  --muted:#6e6352; --line:#8e7d62; --accent:#5d4934; --accent2:#7b674d;
  --danger:#743f37; --good:#4f674c; --shadow:#0008;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{
  font-family:Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at 20% 10%,#ffffff08 0 2px,transparent 3px),
    radial-gradient(circle at 80% 70%,#00000012 0 1px,transparent 2px),
    #1e1b17;
}
button{font:inherit;color:inherit}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
.app{width:min(680px,100%);margin:auto;padding:10px}
.paper{
  min-height:calc(100vh - 20px);
  background:
    linear-gradient(90deg,#00000008 1px,transparent 1px),
    linear-gradient(#00000005 1px,transparent 1px),
    linear-gradient(135deg,var(--paper),#f0e6d2 48%,var(--paper2));
  background-size:100% 100%,100% 100%,100% 100%;
  box-shadow:0 0 40px #000b;
  border:1px solid #7b6c55;
  position:relative;overflow:hidden;
}
.paper:after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;
  background-image:radial-gradient(#000 0.55px,transparent .7px);
  background-size:5px 5px;
}
.ui{position:relative;z-index:1;padding:12px}
.header{
  display:grid;grid-template-columns:1fr auto;gap:10px;
  border-bottom:2px solid var(--line);padding-bottom:9px
}
.name{font-size:19px;font-weight:900;letter-spacing:.5px}
.sub{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.clock{text-align:right;font-size:13px;color:var(--muted)}
.clock b{font-size:18px;color:var(--ink)}
.profile{
  margin-top:10px;border:1px solid var(--line);background:#00000008;padding:9px;
  display:grid;grid-template-columns:1fr 1fr;gap:7px
}
.money{font-size:22px;font-weight:900}
.xp{font-size:11px;color:var(--muted);margin-top:2px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{border:1px solid #9a896d;padding:6px;background:#ffffff18}
.statline{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
.bar{height:6px;background:#b6a78c;border:1px solid #8b7b61}
.fill{height:100%;background:var(--accent)}
.fill.bad{background:var(--danger)}

.panel{
  margin-top:10px;border:1px solid var(--line);background:#ffffff16;
  min-height:270px;padding:10px
}
.panel-title{
  display:flex;justify-content:space-between;align-items:end;
  border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:9px
}
.panel-title h2{font-size:16px;margin:0}
.panel-title span{font-size:10px;color:var(--muted);text-transform:uppercase}
.content{font-size:14px;line-height:1.45}
.story-preview{
  border-left:3px solid var(--accent);padding:8px 10px;background:#00000008;margin-bottom:9px
}
.event-list{max-height:180px;overflow:auto}
.event{padding:7px 0;border-bottom:1px dotted #9b8b70}
.event b{font-size:11px;color:var(--muted);margin-right:5px}
.cardgrid{display:grid;gap:7px}
.action-card{
  border:1px solid var(--line);background:#d7c7a7;padding:9px;text-align:left;
  box-shadow:0 2px 0 #7c6d57;cursor:pointer;width:100%
}
.action-card strong{display:block;font-size:14px}
.action-card small{display:block;color:var(--muted);margin-top:3px;font-size:11px}
.action-card .tag{float:right;border:1px solid #8d7c61;padding:2px 5px;font-size:10px}
.notice{padding:9px;border-left:3px solid var(--accent);background:#00000008;font-size:12px}
.nav{
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:9px;
  border-top:1px solid var(--line);padding-top:8px
}
.nav button{
  min-height:50px;border:1px solid var(--line);background:#d3c19e;
  padding:5px 3px;font-size:10px;font-weight:700;cursor:pointer
}
.nav button.active{background:#a99573;box-shadow:inset 0 0 0 2px #5f4c37}
.icon{font-size:17px;display:block;margin-bottom:2px}
.modal{
  position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;
  padding:12px;z-index:20
}
.modal.open{display:flex}
.story-card{
  width:min(640px,100%);max-height:92vh;overflow:auto;
  background:linear-gradient(135deg,#eee2ca,#d9c8a5);
  border:1px solid #77664e;box-shadow:0 15px 50px #000c;
  position:relative
}
.story-head{padding:12px;border-bottom:2px solid var(--line)}
.story-head .chapter{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.story-head h2{margin:4px 0 0;font-size:22px}
.story-body{padding:14px}
.story-body p{margin:0 0 11px;line-height:1.55}
.story-choices{display:grid;gap:7px;padding:0 14px 14px}
.choice{
  width:100%;text-align:left;padding:12px;border:1px solid var(--line);
  background:#cdbb99;box-shadow:0 2px 0 #776852;cursor:pointer
}
.choice strong{display:block}.choice small{display:block;color:var(--muted);margin-top:3px}
.close{position:absolute;right:8px;top:8px;border:0;background:transparent;font-size:22px;cursor:pointer}
.badge{display:inline-block;border:1px solid var(--line);padding:2px 5px;font-size:10px;margin-right:4px}
.empty{color:var(--muted);font-style:italic}
@media(max-width:420px){
  .ui{padding:9px}.name{font-size:16px}.money{font-size:19px}
  .nav button{font-size:9px}.icon{font-size:15px}.panel{min-height:250px}
}
</style>
</head>
<body>
<div class="app"><main class="paper">
<div class="ui">
  <header class="header">
    <div>
      <div class="name">Рублёв Николай Николаевич</div>
      <div class="sub">НИЗШАЯ ЖИЗНЬ · ПУТЬ К ВЫСШЕЙ</div>
    </div>
    <div class="clock"><b id="clock">06:37</b><br><span id="day">День 1 · Пн</span></div>
  </header>

  <section class="profile">
    <div>
      <div class="money" id="money">0 ₽</div>
      <div class="xp">Уровень <b id="level">1</b> · <span id="xp">0</span>/100 XP</div>
    </div>
    <div class="statgrid">
      <div class="stat"><div class="statline"><span>❤️ Здоровье</span><b id="healthV">72</b></div><div class="bar"><div class="fill" id="healthB"></div></div></div>
      <div class="stat"><div class="statline"><span>⚡ Энергия</span><b id="energyV">54</b></div><div class="bar"><div class="fill" id="energyB"></div></div></div>
      <div class="stat"><div class="statline"><span>🍽 Сытость</span><b id="foodV">32</b></div><div class="bar"><div class="fill" id="foodB"></div></div></div>
      <div class="stat"><div class="statline"><span>Тяга</span><b id="cravingV">74</b></div><div class="bar"><div class="fill bad" id="cravingB"></div></div></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">
      <h2 id="panelTitle">История</h2>
      <span id="panelSub">главное</span>
    </div>
    <div id="panelContent" class="content"></div>
  </section>

  <nav class="nav">
    <button data-tab="story" onclick="setTab('story')"><span class="icon">📜</span>История</button>
    <button data-tab="work" onclick="setTab('work')"><span class="icon">💼</span>Заработок</button>
    <button data-tab="shop" onclick="setTab('shop')"><span class="icon">🏪</span>Магазин</button>
    <button data-tab="quests" onclick="setTab('quests')"><span class="icon">✦</span>Задания</button>
    <button data-tab="more" onclick="setTab('more')"><span class="icon">☰</span>Ещё</button>
  </nav>
</div>
</main></div>

<div class="modal" id="storyModal">
  <div class="story-card">
    <button class="close" onclick="closeStory()">×</button>
    <div class="story-head"><div class="chapter" id="storyChapter">ГЛАВА I · ПЕРВЫЙ ДЕНЬ</div><h2 id="storyTitle"></h2></div>
    <div class="story-body" id="storyBody"></div>
    <div class="story-choices" id="storyChoices"></div>
  </div>
</div>

<script>
const KEY="nizhshaya_zhizn_v02";
const DAYS=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
let s={
  money:0,health:72,energy:54,food:32,craving:74,dependence:81,
  xp:0,level:1,day:1,minutes:397,tab:"story",
  inventory:[],flags:{},log:[],seenStories:{}
};

function loadGame(){
  try{const x=JSON.parse(localStorage.getItem(KEY));if(x)s={...s,...x,flags:{...s.flags,...(x.flags||{})},seenStories:{...s.seenStories,...(x.seenStories||{})}}}catch(e){}
}
function saveGame(){
  localStorage.setItem(KEY,JSON.stringify(s));
}
function fmtMoney(n){return Math.floor(n).toLocaleString("ru-RU")+" ₽"}
function clamp(n){return Math.max(0,Math.min(100,n))}
function timeText(){let h=Math.floor(s.minutes/60)%24,m=s.minutes%60;return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")}
function addLog(text){s.log.unshift({t:timeText(),text});s.log=s.log.slice(0,35)}
function addTime(min){
  s.minutes+=min;
  while(s.minutes>=1440){s.minutes-=1440;s.day++;addLog("Начался новый день.")}
  const hours=min/60;
  s.food=clamp(s.food-hours*1.15);
  s.craving=clamp(s.craving+hours*.9);
  if(s.food<8)s.health=clamp(s.health-hours*.28);
  if(s.energy<5)s.health=clamp(s.health-hours*.18);
}
function addXP(n){
  s.xp+=n;
  while(s.xp>=100){s.xp-=100;s.level++;addLog("Новый уровень: "+s.level+".")}
}
function spend(cost){
  if(s.money<cost)return false;s.money-=cost;return true;
}
function doAction({minutes=0,money=0,health=0,energy=0,food=0,craving=0,xp=0,msg}){
  addTime(minutes);
  s.money+=money;
  s.health=clamp(s.health+health);
  s.energy=clamp(s.energy+energy);
  s.food=clamp(s.food+food);
  s.craving=clamp(s.craving+craving);
  addXP(xp);
  if(msg)addLog(msg);
  saveGame();render();
}
function showStory(id,chapter,title,body,choices){
  if(s.seenStories[id])return;
  document.getElementById("storyChapter").textContent=chapter;
  document.getElementById("storyTitle").textContent=title;
  document.getElementById("storyBody").innerHTML=body;
  const box=document.getElementById("storyChoices");box.innerHTML="";
  choices.forEach(c=>{
    const b=document.createElement("button");b.className="choice";
    b.innerHTML="<strong>"+c.title+"</strong>"+(c.desc?"<small>"+c.desc+"</small>":"");
    b.onclick=()=>{s.seenStories[id]=true;c.fn();closeStory();saveGame();render()};
    box.appendChild(b);
  });
  document.getElementById("storyModal").classList.add("open");
}
function closeStory(){document.getElementById("storyModal").classList.remove("open")}

function setTab(tab){s.tab=tab;saveGame();render()}

function render(){
  document.getElementById("money").textContent=fmtMoney(s.money);
  document.getElementById("level").textContent=s.level;
  document.getElementById("xp").textContent=s.xp;
  document.getElementById("clock").textContent=timeText();
  document.getElementById("day").textContent="День "+s.day+" · "+DAYS[(s.day-1)%7].slice(0,2);
  for(const [id,key] of [["health","health"],["energy","energy"],["food","food"],["craving","craving"]]){
    document.getElementById(id+"V").textContent=Math.round(s[key]);
    document.getElementById(id+"B").style.width=s[key]+"%";
  }
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===s.tab));
  renderPanel();
}
function renderPanel(){
  const title=document.getElementById("panelTitle"),sub=document.getElementById("panelSub"),c=document.getElementById("panelContent");
  if(s.tab==="story"){
    title.textContent="История";sub.textContent="главное";
    const last=s.log.slice(0,7).map(x=>`<div class="event"><b>${x.t}</b>${x.text}</div>`).join("");
    c.innerHTML=`
      <div class="story-preview"><b>Текущая ситуация</b><br>
      Ты на улицах Мурманска. У тебя нет дома, работы и документов. Но впервые за долгое время есть одна вещь — план.</div>
      <div class="notice"><b>Следующий сюжетный шаг:</b> ${currentGoal()}</div>
      <h3 style="font-size:12px;border-bottom:1px solid var(--line);padding-bottom:5px">Последние события</h3>
      <div class="event-list">${last||'<span class="empty">Пока ничего не произошло.</span>'}</div>`;
  }else if(s.tab==="work"){
    title.textContent="Заработок";sub.textContent="работа и деньги";
    const jobs=[
      {name:"Разовая подработка",desc:"1 час · простая работа без документов",pay:"180–260 ₽",need:10,mins:60,food:-5,xp:7},
      {name:"Погрузка",desc:"2 часа · тяжелее, но платят больше",pay:"600–850 ₽",need:25,mins:120,food:-10,xp:14}
    ];
    c.innerHTML='<div class="cardgrid">'+jobs.map((j,i)=>`
      <button class="action-card" onclick="doJob(${i})" ${s.energy<j.need?'disabled':''}>
        <span class="tag">${j.pay}</span><strong>${j.name}</strong><small>${j.desc} · −${j.need} энергии · −${Math.abs(j.food)} сытости</small>
      </button>`).join("")+
      `<button class="action-card" onclick="learnDocuments()"><strong>📄 Разобраться с документами</strong><small>20 минут · −3 энергии · открывает путь к нормальной работе</small></button>
      <div class="notice">Подработки можно повторять, но они занимают время и силы. Бесконечной бесплатной фарм-тапалки здесь не будет.</div>
      </div>`;
  }else if(s.tab==="shop"){
    title.textContent="Магазин";sub.textContent="еда и необходимые вещи";
    const items=[
      {name:"Хлеб",price:60,food:18},
      {name:"Лапша быстрого приготовления",price:70,food:22},
      {name:"Суп",price:110,food:35},
      {name:"Сытный горячий обед",price:280,food:55}
    ];
    c.innerHTML='<div class="cardgrid">'+items.map((x,i)=>`
      <button class="action-card" onclick="buyFood(${i})" ${s.money<x.price?'disabled':''}>
        <span class="tag">${x.price} ₽</span><strong>${x.name}</strong><small>+${x.food} сытости · 2 минуты</small>
      </button>`).join("")+
      `<div class="notice">Цены пока тестовые. Экономику будем балансировать по реальному прохождению.</div></div>`;
  }else if(s.tab==="quests"){
    title.textContent="Задания";sub.textContent="сюжет";
    c.innerHTML=`
      <div class="notice"><b>Главная линия</b><br>${currentGoal()}</div>
      <div style="margin-top:9px">
        <span class="badge">Глава I</span><span class="badge">Мурманск</span>
      </div>
      <div class="cardgrid" style="margin-top:9px">
        <div class="action-card"><strong>Вернуть себе имя</strong><small>${s.flags.docsStarted?"Начато":"Пока закрыто: нужны первые деньги и информация о документах."}</small></div>
        <div class="action-card"><strong>Пережить первый день</strong><small>Основная цель первой главы.</small></div>
      </div>`;
  }else{
    title.textContent="Ещё";sub.textContent="интерфейс";
    c.innerHTML=`
      <div class="cardgrid">
        <button class="action-card" onclick="showInventory()"><strong>🎒 Инвентарь</strong><small>Вещи, которые у тебя есть.</small></button>
        <button class="action-card" onclick="showMap()"><strong>🗺 Карта</strong><small>Доступные места Мурманска.</small></button>
        <button class="action-card" onclick="saveGame();addLog('Игра сохранена.');render()"><strong>💾 Сохранить</strong><small>Сохранение в памяти браузера.</small></button>
        <div class="notice">Версия v0.2. Это уже каркас интерфейса; дальше добавим нормальную карту, достижения, больше сюжетных сцен и визуальные ассеты.</div>
      </div>`;
  }
}
function currentGoal(){
  if(!s.flags.first100)return"Найти первые 100 ₽.";
  if(!s.flags.firstMeal)return"Найти еду и восстановить силы.";
  if(!s.flags.docs)return"Найти способ заработать и узнать про документы.";
  if(!s.flags.docsStarted)return"Начать восстановление документов.";
  return"Продолжить цепочку восстановления документов.";
}
function doJob(i){
  const jobs=[
    {pay:180+Math.floor(Math.random()*81),need:10,mins:60,food:-5,xp:7,name:"разовой подработке"},
    {pay:600+Math.floor(Math.random()*251),need:25,mins:120,food:-10,xp:14,name:"погрузке"}
  ];
  const j=jobs[i];
  if(s.energy<j.need){addLog("Сейчас ты слишком вымотан для этой работы.");render();return}
  doAction({minutes:j.mins,money:j.pay,energy:-j.need,food:j.food,xp:j.xp,msg:`Ты отработал и получил ${j.pay} ₽.`});
  if(!s.flags.firstJob){s.flags.firstJob=true;addLog("Ты понял: даже небольшая работа может стать первым шагом.");}
}
function learnDocuments(){
  if(s.energy<3){addLog("Слишком мало энергии.");render();return}
  doAction({minutes:20,energy:-3,food:-1,xp:5,msg:"Ты узнаёшь, что без восстановления документов нормальную работу найти будет трудно."});
  s.flags.docs=true;saveGame();render();
  if(!s.seenStories.docsIntro){
    setTimeout(()=>showStory("docsIntro","ГЛАВА I · ДОКУМЕНТЫ","Вернуть себе имя",
      "<p>Несколько лет назад ты мог открыть кошелёк и достать паспорт. Теперь у тебя даже этого нет.</p><p>Сначала придётся восстановить документы. И это будет стоить времени и денег.</p>",
      [{title:"Ладно. Начать с малого.",desc:"Продолжить поиски заработка.",fn:()=>{}}]),200);
  }
}
function buyFood(i){
  const items=[
    {name:"Хлеб",price:60,food:18},{name:"Лапша быстрого приготовления",price:70,food:22},
    {name:"Суп",price:110,food:35},{name:"Сытный горячий обед",price:280,food:55}
  ];
  const x=items[i];
  if(!spend(x.price)){addLog("Не хватает денег.");render();return}
  doAction({minutes:2,food:x.food,xp:2,msg:`Ты купил: ${x.name}.`});
  if(!s.flags.firstMeal){
    s.flags.firstMeal=true;saveGame();
    setTimeout(()=>showStory("firstMeal","ГЛАВА I · ПЕРВЫЙ ДЕНЬ","Первые деньги",
      "<p>Еда не решила твою жизнь. Но голова стала работать чуть яснее.</p><p>Теперь нужен следующий шаг — заработать достаточно, чтобы не возвращаться к нулю каждый вечер.</p>",
      [{title:"Искать работу",desc:"Открыть раздел заработка.",fn:()=>setTab("work")},{title:"Сначала осмотреть город",desc:"Ничего не терять из виду.",fn:()=>setTab("story")}]),200);
  }
}
function showMap(){
  showStory("mapTemp","КАРТА · МУРМАНСК","Карта пока в разработке",
    "<p><b>Открыто:</b> железнодорожный вокзал.</p><p>Дальше появятся улицы, магазин, столовая, больница, места работы и новые районы.</p>",
    [{title:"Понятно",desc:"Вернуться в игру.",fn:()=>{}}]);
}
function showInventory(){
  showStory("invTemp","ИНВЕНТАРЬ","Твои вещи",
    s.inventory.length?("<p>"+s.inventory.join("</p><p>")+"</p>"):"<p>Пока пусто.</p>",
    [{title:"Закрыть",desc:"",fn:()=>{}}]);
}
function firstStory(){
  if(s.seenStories.opening)return;
  setTimeout(()=>showStory("opening","ГЛАВА I · ПЕРВЫЙ ДЕНЬ","06:37",
    "<p>Николай просыпается на скамье на мурманском вокзале. Несколько секунд он просто смотрит в потолок.</p><p>Слишком много всего произошло. Дом сгорел. Семья исчезла из его жизни. Друг погиб. Работа, деньги и документы остались в прошлом.</p><p>Охранник подходит ближе: пора уходить.</p>",
    [
      {title:"Осмотреть себя",desc:"Понять, что у тебя осталось.",fn:()=>{addLog("Ты проверяешь карманы. Денег нет.");addXP(3)}},
      {title:"Осмотреть вокзал",desc:"Возможно, здесь найдётся какая-нибудь возможность.",fn:()=>{addLog("Ты внимательно осматриваешь вокзал.");addXP(3)}},
      {title:"Просто выйти",desc:"Хватит сидеть. Нужно начинать.",fn:()=>{addLog("Ты выходишь на улицу.");addXP(3)}}
    ]),300);
}
loadGame();
if(!s.log.length){
  addLog("06:37. Николай просыпается на вокзале.");
  addLog("Охранник просит его покинуть здание.");
  saveGame();
}
render();
firstStory();

setInterval(()=>{
  addTime(1);saveGame();render();
},60000);
</script>
